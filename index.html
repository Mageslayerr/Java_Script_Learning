<html>
    <head>
        <title> Dice Game </title>
          <link rel="stylesheet" href="style.css">
    </head>
   <body>
      <p>The Game is simple: roll the dice.</p>
     
     
      <p> Which dice would you like to roll:
      <form action="dice.html" method="get">

     <br />
     <!-- Dice selection -->
      
     <input type="radio" name="diceType" value="d6"> D6
     <input type="radio" name="diceType" value="d20"> D20
     <input type="radio" name="diceType" value="d100"> D100
      </p>
  
      
    </form>
      
    <form>
        <!-- Roll button -->
         <button type="button" id="rollButton"> Roll Dice </button>
      </form>
      <!-- need to have JavaScript know which dice was selected and then roll that dice -->
      

      <p> Your roll: <span id="rollResult"></span> </p>

    <script src="script.js"></script>
     </body> 

</html>
